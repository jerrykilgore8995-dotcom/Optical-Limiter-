name: Native Circuit Translation
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-deck.yml'
      - 'manual/manual.cir'
  workflow_dispatch:
jobs:
  flatten:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 native/flatten_deck.py
      - run: python3 native/audit_deck.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-circuit-ir-and-audit
          path: |
            native/deck.json
            native/audit.json
