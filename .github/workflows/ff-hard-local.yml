name: FF Hard Knee Local Ratio
on:
  push:
    paths:
      - '.github/workflows/ff-hard-local.yml'
  workflow_dispatch:
jobs:
  ratio:
    name: FF hard ${{ matrix.ratio }} to 1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        ratio: [2, 3, 4, 8, 12, 20]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y ngspice python3-numpy
      - run: /usr/bin/python3 manual/ff_hard_local.py ffhard_${{ matrix.ratio }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffhard-${{ matrix.ratio }}
          path: manual/measurements/ffhard_${{ matrix.ratio }}/results.json
          if-no-files-found: warn
