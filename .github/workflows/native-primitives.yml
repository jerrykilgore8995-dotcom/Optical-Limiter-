name: Native MNA Primitives
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-primitives.yml'
      - 'manual/manual.cir'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 native/flatten_deck.py
      - run: python3 native/generate_native.py
      - run: g++ -std=c++20 -O2 -Wall -Wextra native/PrimitiveTest.cpp -o primitive-test
      - run: ./primitive-test
      - run: g++ -std=c++20 -O2 -Wall -Wextra native/DeckTest.cpp -o deck-test
      - run: ./deck-test
      - uses: actions/upload-artifact@v4
        with:
          name: optical-native-deck
          path: |
            native/DeckGenerated.hpp
            native/unsupported.json
